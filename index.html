<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2efe8">
  <title>Breakout</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <p class="eyebrow">A SMALL BROWSER GAME</p>
        <h1>Breakout</h1>
      </div>

      <div class="hud" aria-label="Game information">
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Lives</span>
          <span id="lives" class="hud-value">3</span>
        </div>
      </div>
    </header>

    <section class="game-frame" aria-label="Breakout game">
      <canvas
        id="game-canvas"
        width="800"
        height="500"
        aria-label="Breakout game. Move the paddle to bounce the ball and break all the bricks."
      ></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p class="eyebrow">READY TO PLAY?</p>
          <h2 id="overlay-title">Break the bricks.</h2>
          <p id="overlay-message">
            Move with the arrow keys or mouse. Press Space or click to launch.
          </p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>
    </section>

    <footer class="game-footer">
      <p id="status" aria-live="polite">Move with ← → or your mouse</p>
      <p>Press <kbd>Space</kbd> to launch</p>
    </footer>
  </main>
</body>
</html>
